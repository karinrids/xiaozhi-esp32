name: Build Boards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build xmini-c3
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/build.py xmini-c3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xmini-c3-firmware
          path: build/xmini-c3/*.bin
